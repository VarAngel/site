  --ease-out:cubic-bezier(.2,0,0,1);

  --f-brand:"Unbounded",system-ui,sans-serif;
  --f-plain:"Geist",system-ui,-apple-system,sans-serif;

@media(min-width:600px){:root{--gutter:24px}}

[data-theme="light"]{
  --primary:#8D4959;--on-primary:#FFFFFF;--primary-container:#FFD9DF;--on-primary-container:#713342;
  --secondary:#75565C;--on-secondary:#FFFFFF;--secondary-container:#FFD9DF;--on-secondary-container:#5B3F44;
  --tertiary:#7A5732;--on-tertiary:#FFFFFF;--tertiary-container:#FFDCBC;--on-tertiary-container:#60401D;
  --surface:#FFF8F7;--on-surface:#22191B;--on-surface-variant:#524345;
  --surface-c-lowest:#FFFFFF;--surface-c-low:#FFF0F1;--surface-c:#FBEAEB;--surface-c-high:#F5E4E6;--surface-c-highest:#EFDEE0;
  --outline:#847375;--outline-variant:#D6C2C4;
  --inverse-surface:#382E2F;--inverse-on-surface:#FEEDEE;--inverse-primary:#FFB1C0;
  color-scheme:light;
}
[data-theme="dark"]{
  --primary:#FFB1C0;--on-primary:#551D2C;--primary-container:#713342;--on-primary-container:#FFD9DF;
  --secondary:#E4BDC3;--on-secondary:#43292E;--secondary-container:#5B3F44;--on-secondary-container:#FFD9DF;
  --tertiary:#ECBE91;--on-tertiary:#462A09;--tertiary-container:#60401D;--on-tertiary-container:#FFDCBC;
  --surface:#191113;--on-surface:#EFDEE0;--on-surface-variant:#D6C2C4;
  --surface-c-lowest:#140C0E;--surface-c-low:#22191B;--surface-c:#261D1F;--surface-c-high:#312829;--surface-c-highest:#3C3234;
  --outline:#9F8C8F;--outline-variant:#524345;
  --inverse-surface:#EFDEE0;--inverse-on-surface:#382E2F;--inverse-primary:#8D4959;
  color-scheme:dark;
}

html{overflow-x:clip;overscroll-behavior-y:none}
body{min-height:100dvh;overflow-x:clip;background:var(--surface);color:var(--on-surface);
  font-family:var(--f-plain);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:var(--bar-h);padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
::selection{background:var(--primary-container);color:var(--on-primary-container)}
:where(a,button):focus-visible{outline:3px solid var(--secondary);outline-offset:2px}

.ic{width:24px;height:24px;flex-shrink:0;fill:currentColor;display:block;pointer-events:none}

.page{width:min(var(--content),100%);margin-inline:auto;padding-inline:var(--gutter);
  transition:transform 420ms var(--ease-out)}
.page.pull{transition:none;will-change:transform}

.display-s{font-family:var(--f-brand);font-weight:600;font-size:clamp(2.25rem,1.6rem + 2vw,2.8125rem);line-height:1.2}
.body-m{font-size:.875rem;line-height:1.43;letter-spacing:.25px}
.label-m{font-family:var(--f-mono);font-weight:500;font-size:.75rem;line-height:1.333;letter-spacing:.5px}
.em{font-weight:700}
.n-s{user-select: none}

.state{position:relative;isolation:isolate}
.state::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;
  background:currentColor;opacity:0;transition:opacity var(--d-effects-fast) var(--e-effects-fast)}
.state:hover::after{opacity:var(--st-hover)}
.state:focus-visible::after{opacity:var(--st-focus)}
@media(hover:none){.state:hover::after{opacity:0}}
.ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:-1;opacity:.12;transform:scale(0);
  background:radial-gradient(closest-side,currentColor 0,currentColor 72%,color-mix(in srgb,currentColor 40%,transparent) 88%,transparent 100%)}

.th-ic{grid-area:1/1;transition:rotate var(--d-spatial) var(--e-spatial),scale var(--d-spatial) var(--e-spatial),opacity var(--d-effects-fast) var(--e-effects-fast)}
[data-theme="dark"] .th-sun,[data-theme="light"] .th-moon{opacity:0;scale:.4}
[data-theme="dark"] .th-sun{rotate:90deg}
[data-theme="light"] .th-moon{rotate:-90deg}

.bar{position:fixed;inset:0 0 auto;z-index:100;height:var(--bar-h);--p:0;
  background:color-mix(in srgb,var(--surface-c) calc(var(--p) * 100%),var(--surface))}
.bar-in{width:min(var(--content),100%);height:100%;margin-inline:auto;padding-inline:var(--gutter);display:flex;align-items:center;justify-content:space-between}
.bar-lead{display:flex;align-items:center;gap:8px}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:20px;overflow:hidden;
  background:var(--secondary-container);color:var(--on-secondary-container);
  transition:border-radius var(--d-spatial-fast) var(--e-spatial-fast)}
.icon-btn:active{border-radius:var(--sh-sm)}
#topBtn{opacity:0;visibility:hidden;scale:.6;
  transition:opacity var(--d-effects) var(--e-effects),scale var(--d-spatial) var(--e-spatial),visibility 0s linear var(--d-effects)}
.bar.collapsed #topBtn{opacity:1;visibility:visible;scale:1;transition-delay:0s}

.big{padding:16px 16px 28px}
.js .big{opacity:0}
.ftitle{position:fixed;left:0;top:0;transform-origin:0 0;white-space:nowrap;pointer-events:none;
  color:var(--on-surface);will-change:transform}
.ftitle:not(.ready){visibility:hidden}

.gh{color:var(--primary);font-weight:500;font-size:.875rem;line-height:1.43;letter-spacing:.1px;padding:28px 16px 8px}
.grp{display:grid;gap:2px}
.grp+.grp{margin-top:12px}
.item{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:12px 16px;overflow:hidden;
  background:var(--surface-c);border-radius:var(--sh-xs);
  transition:border-radius var(--d-spatial-fast) var(--e-spatial-fast)}
.grp>.item:first-child{border-radius:var(--sh-xl) var(--sh-xl) var(--sh-xs) var(--sh-xs)}
.grp>.item:last-child{border-radius:var(--sh-xs) var(--sh-xs) var(--sh-xl) var(--sh-xl)}
.grp>.item:only-child{border-radius:var(--sh-xl)}
.grp>.item.pressed{border-radius:36px}
.item .tr{color:var(--on-surface-variant)}
.ld{display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;border-radius:20px;overflow:hidden}
.ld.c-a{background:var(--primary-container);color:var(--on-primary-container)}
.ld.c-b{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.ld.c-c{background:var(--secondary-container);color:var(--on-secondary-container)}
.txt{display:flex;flex-direction:column;flex:1;min-width:0}
.hl{font-size:1rem;line-height:1.5;letter-spacing:.15px;font-weight:500}
.sup{font-size:.875rem;line-height:1.43;letter-spacing:.25px;color:var(--on-surface-variant)}

.wavy{display:block;width:calc(100% - 32px);height:12px;margin:40px 16px 0;overflow:visible}
.wavy path{fill:none;stroke:var(--outline-variant);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
.foot{padding:28px 16px 32px;color:var(--on-surface-variant);text-align:center}
.foot p+p{margin-top:6px}

@media(prefers-reduced-motion:no-preference){
  ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
  .vt-theme::view-transition-old(root){z-index:0}
  .vt-theme::view-transition-new(root){z-index:1}
}
@media(prefers-contrast:more){:root{--outline-variant:var(--outline)}.sup,.item .tr{color:var(--on-surface)}}
@media(forced-colors:active){
  .item,.ld{border:1px solid CanvasText}
  .ic{fill:CanvasText}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}

  <script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const html = document.documentElement;
  const rmq = matchMedia('(prefers-reduced-motion:reduce)'); // rmq.matches всегда актуален
  const EASE = 'cubic-bezier(.2,0,0,1)';

  /* ── Тема ─────────────────────────────────────────── */
  const themeBtn = $('#themeBtn');
  const themeMeta = $('meta[name="theme-color"]');
  const THEME_COLOR = { dark: '#191113', light: '#FFF8F7' };

  const applyTheme = t => {
    html.dataset.theme = t;
    themeMeta.content = THEME_COLOR[t];
  };

  themeBtn.addEventListener('click', () => {
    const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
    const commit = () => {
      applyTheme(next);
      try { localStorage.setItem('theme', next); } catch {}
    };
    if (rmq.matches || !document.startViewTransition) return commit();

    // Круговое раскрытие от кнопки
    const r = themeBtn.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    html.classList.add('vt-theme');
    const vt = document.startViewTransition(commit);
    vt.ready.then(() => html.animate(
      { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
      { duration: 560, easing: EASE, pseudoElement: '::view-transition-new(root)' }
    )).catch(() => {});
    vt.finished.finally(() => html.classList.remove('vt-theme'));
  });

  /* ── Заголовок: большой → в панель ───────────────── */
  const bar = $('#bar'), big = $('#bigTitle'), ft = $('#ftitle'), topBtn = $('#topBtn');
  const END_FONT = 22;   // конечный размер шрифта в панели, px
  const GAP = 12;        // отступ заголовка от кнопки «Наверх»
  let m, ticking = false;

  function measure() {
    const r = big.getBoundingClientRect(), cs = getComputedStyle(big);
    const fs = parseFloat(cs.fontSize);
    const lh = parseFloat(cs.lineHeight) || fs * 1.2;
    const k = END_FONT / fs;
    const b = topBtn.getBoundingClientRect();
    const y0 = r.top + scrollY + parseFloat(cs.paddingTop);
    const yDock = (bar.offsetHeight - lh * k) / 2;
    m = {
      k, y0, yDock,
      x0: r.left + parseFloat(cs.paddingLeft),
      x1: b.left + b.width / 2 + topBtn.offsetWidth / 2 + GAP, // центр не зависит от scale кнопки
      travel: Math.max(1, y0 - yDock)
    };
  }

  function render() {
    ticking = false;
    const s = Math.max(0, scrollY);
    const p = Math.min(1, s / m.travel);
    const e = p * p * (3 - 2 * p);                 // smoothstep
    const k = 1 + (m.k - 1) * e;
    const x = m.x0 + (m.x1 - m.x0) * e;
    const y = Math.max(m.yDock, m.y0 - s);
    ft.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${k.toFixed(4)})`;
    bar.style.setProperty('--p', e.toFixed(3));
    bar.classList.toggle('collapsed', p >= .98);
  }

  const schedule = () => { if (!ticking) { ticking = true; requestAnimationFrame(render); } };
  const relayout = () => { measure(); schedule(); };

  addEventListener('scroll', schedule, { passive: true });
  addEventListener('resize', relayout);
  document.fonts?.ready.then(relayout);
  measure(); render();
  ft.classList.add('ready');

  topBtn.addEventListener('click', () =>
    scrollTo({ top: 0, behavior: rmq.matches ? 'auto' : 'smooth' }));

  /* ── Копирование по клику (data-copy="текст") ────── */
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    // Запасной вариант: нет HTTPS / нет доступа к буферу
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.append(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
    return ok;
  }

  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-copy]');
    if (!el) return;
    const ok = await copyText(el.dataset.copy);
    const sup = el.querySelector('.sup'), use = el.querySelector('.tr use');
    el.dataset.supOrig ??= sup.textContent;
    el.dataset.iconOrig ??= use.getAttribute('href');
    sup.textContent = ok ? 'Скопировано' : 'Не удалось скопировать';
    use.setAttribute('href', ok ? '#i-check' : el.dataset.iconOrig);
    clearTimeout(el._timer);
    el._timer = setTimeout(() => {
      sup.textContent = el.dataset.supOrig;
      use.setAttribute('href', el.dataset.iconOrig);
    }, 1600);
  });

  /* ── Нажатие: ripple + «морфинг» углов ───────────── */
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest('a.item,button.item,.icon-btn');
    if (!el || e.button > 0) return;

    const ac = new AbortController(), { signal } = ac;
    let wave, grow, moved = false;

    const start = () => {
      if (wave) return;
      el.classList.add('pressed');
      if (rmq.matches) return;
      const r = el.getBoundingClientRect();
      const sx = el.offsetWidth / r.width || 1, sy = el.offsetHeight / r.height || 1;
      const px = (e.clientX - r.left) * sx, py = (e.clientY - r.top) * sy;
      const cx = el.offsetWidth / 2, cy = el.offsetHeight / 2;
      const R = Math.hypot(cx, cy) * 1.05;
      wave = document.createElement('span');
      wave.className = 'ripple';
      wave.style.cssText = `left:${cx - R}px;top:${cy - R}px;width:${2 * R}px;height:${2 * R}px`;
      el.append(wave);
      grow = wave.animate(
        [{ transform: `translate(${(px - cx).toFixed(1)}px,${(py - cy).toFixed(1)}px) scale(.08)` },
         { transform: 'translate(0,0) scale(1)' }],
        { duration: Math.min(700, 320 + R * 1.2), easing: EASE, fill: 'forwards' });
    };

    // На таче чуть ждём, чтобы не вспыхивать при начале скролла
    const timer = e.pointerType === 'touch' ? setTimeout(start, 60) : void start();

    const x0 = e.clientX, y0 = e.clientY;
    const move = ev => {
      if (!wave && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 8) { moved = true; clearTimeout(timer); }
    };

    const end = async ev => {
      clearTimeout(timer);
      ac.abort(); // снимает все слушатели разом
      if (ev.type === 'pointerup' && !wave && !moved) start();
      el.classList.remove('pressed');
      if (!wave) return;
      const w = wave;
      grow.updatePlaybackRate(2.6);
      await grow.finished.catch(() => {});
      await w.animate([{ opacity: .12 }, { opacity: 0 }],
        { duration: 260, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' }).finished.catch(() => {});
      w.remove();
    };

    el.addEventListener('pointermove', move, { signal });
    for (const n of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(n, end, { signal });
  });

  /* ── Резиновый оверскролл ────────────────────────── */
  const page = $('.page');
  let pulled = 0, fromTop = true, acc = 0, relTimer = 0, ty = null;
  const curve = d => .028 * (1 - Math.exp(-d / 500));
  const atTop = () => scrollY <= 0;
  const atBottom = () => Math.ceil(scrollY + innerHeight) >= html.scrollHeight - 1;

  function stretch(v, top) {
    pulled = v; fromTop = top;
    page.style.transformOrigin = top ? '50% 0' : '50% 100%';
    page.style.transform = v ? `scaleY(${(1 + v).toFixed(4)})` : '';
  }
  const pull = (v, top) => { page.classList.add('pull'); stretch(v, top); };
  const release = () => { page.classList.remove('pull'); stretch(0, fromTop); };

  addEventListener('wheel', e => {
    if (rmq.matches) return;
    const up = e.deltaY < 0;
    if (up ? atTop() : atBottom()) {
      acc += Math.abs(e.deltaY);
      pull(curve(acc), up);
      clearTimeout(relTimer);
      relTimer = setTimeout(() => { acc = 0; release(); }, 140);
    }
  }, { passive: true });

  addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchmove', e => {
    if (rmq.matches || ty === null) return;
    const y = e.touches[0].clientY, d = y - ty;
    if (d > 0 && atTop()) pull(curve(d), true);
    else if (d < 0 && atBottom()) pull(curve(-d), false);
    else { if (pulled) stretch(0, true); ty = y; }
  }, { passive: true });
  const touchEnd = () => { ty = null; if (pulled) release(); };
  addEventListener('touchend', touchEnd, { passive: true });
  addEventListener('touchcancel', touchEnd, { passive: true });
})();
  </script>
